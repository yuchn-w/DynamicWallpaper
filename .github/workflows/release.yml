name: 發布 macOS 下載版

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 要發布的 Git 標籤
        required: true
        default: v0.8.1
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: 建置並發布
    runs-on: macos-15

    steps:
      - name: 取得原始碼
        uses: actions/checkout@v5

      - name: 建置及封裝 Apple Silicon 版本
        run: ./script/package_release.sh

      - name: 建立或更新 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.zip dist/*.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/*.zip \
              dist/*.sha256 \
              --verify-tag \
              --prerelease \
              --title "動態壁紙 0.8.1" \
              --notes-file RELEASE_NOTES.md
          fi
